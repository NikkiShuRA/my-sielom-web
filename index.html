<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <script>
    // Тема применяется до отрисовки, чтобы не было вспышки светлого экрана
    try { const t = JSON.parse(localStorage.getItem("sielom.theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <title>Мой Сиелом — Расписание</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Мой Сиелом">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://sielom.ru" crossorigin>
  <link rel="preload" href="assets/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/wix-madefor-display-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <div class="app__head">
      <!-- Логотип -->
      <header class="brand">
        <button class="icon-btn" id="sidebarToggle" aria-label="Свернуть панель" aria-controls="sidebar" title="Свернуть панель">
          <!-- панель открыта: шеврон «‹» (свернуть) -->
          <svg class="ico-hide" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v14" stroke="currentColor" stroke-width="1.6"/><path d="M13.6 7.6L11.2 10l2.4 2.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <!-- панель свёрнута, в покое: простой значок панели -->
          <svg class="ico-rest" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v14" stroke="currentColor" stroke-width="1.6"/><rect x="3.3" y="3.8" width="4" height="12.4" rx="2.7" fill="currentColor" opacity=".3"/></svg>
          <!-- панель свёрнута, при наведении: шеврон «›» (развернуть) -->
          <svg class="ico-show" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v14" stroke="currentColor" stroke-width="1.6"/><path d="M11.2 7.6L13.6 10l-2.4 2.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="brand__logo">
          <img src="assets/icon.svg" width="40" height="40" alt="Мой Сиелом">
          <div class="brand__text">
            <span class="brand__name">Мой Сиелом</span>
            <span class="brand__sub">Расписание</span>
          </div>
        </div>
      </header>

      <!-- Заголовок расписания и навигация по периоду -->
      <header class="topbar">
        <div class="topbar__title">
          <span class="topbar__kind" id="entityKind">Группа</span>
          <span class="topbar__name" id="entityName">…</span>
        </div>

        <div class="toolbar">
          <button class="btn btn--outline today-btn" id="todayBtn" title="Вернуться к сегодня (T)">Сегодня</button>

          <div class="toolbar__nav">
          <div class="pager">
            <button class="pager__btn" id="prevWeek" aria-label="Назад" title="Назад (←)">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="pager__label" aria-live="polite">
              <span class="pager__main" id="periodLabel">—</span>
              <span class="pager__sub" id="periodSub"></span>
            </div>
            <button class="pager__btn" id="nextWeek" aria-label="Вперёд" title="Вперёд (→)">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>

          <div class="segmented" id="viewSwitch" role="tablist" aria-label="Режим просмотра">
            <span class="segmented__thumb" aria-hidden="true"></span>
            <button class="segmented__btn" data-view="day" role="tab">День</button>
            <button class="segmented__btn" data-view="week" role="tab">Неделя</button>
          </div>
          </div>
        </div>
      </header>
    </div>

    <div class="app__body">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <!-- Боковая панель -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <div class="brand__logo">
          <img src="assets/icon.svg" width="32" height="32" alt="" aria-hidden="true">
          <div class="brand__text">
            <span class="brand__name">Мой Сиелом</span>
            <span class="brand__sub">Расписание</span>
          </div>
        </div>
        <button class="icon-btn icon-btn--sm" id="sidebarClose" aria-label="Свернуть панель" aria-controls="sidebar" title="Свернуть панель">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v14" stroke="currentColor" stroke-width="1.6"/><path d="M13.6 7.6L11.2 10l2.4 2.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <label class="search">
        <svg class="search__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.75" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Группа, преподаватель, кабинет" autocomplete="off" aria-label="Поиск по группам, преподавателям и кабинетам">
        <kbd class="search__kbd" aria-hidden="true">/</kbd>
        <button class="search__clear" id="searchClear" hidden aria-label="Очистить поиск">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </label>

      <div class="filters">
        <div class="segmented segmented--tabs" id="kindTabs" role="tablist" aria-label="Что ищем">
          <span class="segmented__thumb" aria-hidden="true"></span>
          <button class="segmented__btn tabs__btn" data-tab="group" role="tab">Группы</button>
          <button class="segmented__btn tabs__btn" data-tab="teacher" role="tab">Преподаватели</button>
          <button class="segmented__btn tabs__btn" data-tab="room" role="tab">Кабинеты</button>
        </div>
        <button class="fav-filter" id="favFilter" aria-pressed="false" aria-label="Только избранное" title="Только избранное">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 2.75C4 2.34 4.34 2 4.75 2h6.5c.41 0 .75.34.75.75V14l-4-2.25L4 14V2.75z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <nav class="crumbs" aria-label="Навигация по списку">
        <button class="icon-btn icon-btn--sm" id="crumbBack" aria-label="Назад" title="Назад">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="crumb" id="crumb"></div>
      </nav>

      <div class="list-wrap">
        <ul class="list" id="list"></ul>
      </div>

      <div class="settings">
        <button class="settings__row" disabled>
          <svg class="settings__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2a4 4 0 0 0-4 4v2.5L2.75 11h10.5L12 8.5V6a4 4 0 0 0-4-4zM6.5 13a1.5 1.5 0 0 0 3 0" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span class="settings__label">Уведомления</span>
          <span class="settings__soon">Скоро</span>
        </button>
        <button class="settings__row" id="themeBtn" title="Сменить тему (D)">
          <svg class="settings__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
          <span class="settings__label">Тема оформления</span>
          <span class="settings__value" id="themeValue">Системная</span>
        </button>
        <a class="settings__row" href="about/">
          <svg class="settings__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.25V11M8 5h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="settings__label">О приложении</span>
        </a>
      </div>
    </aside>

    <!-- Расписание -->
    <main class="week-wrap">
      <div class="week" id="week"></div>
    </main>
    </div>
  </div>

  <!-- Детали пары -->
  <dialog class="modal" id="lessonModal" aria-labelledby="mTitle">
    <form method="dialog" class="modal__inner">
      <span class="modal__grip" aria-hidden="true"></span>
      <div class="modal__top">
        <div class="modal__head" id="mHead" tabindex="-1" autofocus></div>
        <button class="modal__x" aria-label="Закрыть">
          <svg width="12" height="12" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M1 1L9 9M9 1L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal__body" id="mBody"></div>
    </form>
  </dialog>

  <script src="app.js?v=3"></script>
</body>
</html>
