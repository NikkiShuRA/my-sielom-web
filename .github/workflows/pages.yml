# Публикует на GitHub Pages: последний релиз в корне, master в /next/, прошлые релизы в /v/<версия>/.
# Запускается после зелёного CI в master и после выпуска релиза (его запускает release.yml)
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Публикуем ровно тот коммит, который прошёл CI
          ref: ${{ github.event.workflow_run.head_sha || 'master' }}
          fetch-depth: 0 # нужны теги, чтобы найти релизы
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Assemble site
        run: bash .github/workflows/assemble-site.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
