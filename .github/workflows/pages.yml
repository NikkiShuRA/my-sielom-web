# Публикует на GitHub Pages два канала: последний релиз в корне и текущий master в /next/.
# В каждом канале приложение и стенд лежат в его корне, презентация из docs/ — в about/
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Окружение github-pages принимает деплой только с веток, поэтому новый тег запускает обычную публикацию с master
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0 # нужны теги, чтобы найти последний релиз

      - name: Assemble site
        run: bash .github/workflows/assemble-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
